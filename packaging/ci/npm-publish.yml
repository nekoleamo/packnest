# CI 模板：默认**只构建不发布**（凭据只放本机，见下）。
#
# 三种用法：
#  A) 只构建（默认，零凭据）：tag 打上后 CI 跑门禁 + 出产物，发布在本机 `make publish`。
#  B) 自托管 runner（仍然"只放本地"）：在你自己机器的 runner 上跑这个 job 的 publish 步骤，
#     token 留在那台机器的 ~/.pi/agent/local/secrets.env，不进任何云端 Secret。
#  C) 云端 Secret：把 publish 步骤取消注释，并在 Settings → Secrets 配 NPM_TOKEN。
#
# 对应 gitee Go 流水线同理（私密变量 / 自托管 runner / 只构建）。
name: npm-publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: 门禁
        run: make check

      - name: 打产物（6 平台 + npm 包）
        run: |
          make release VERSION="${GITHUB_REF_NAME#v}"
          sh scripts/release-npm.sh

      # —— 下面是"发布"步骤：默认注释掉（A 方案）。要用 B/C 方案再取消注释。 ——
      # - name: 发布（先子包后主包）
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}   # B 方案可删掉这行，靠本机凭据文件
      #   run: sh scripts/release-npm.sh --publish

      - name: 产物归档（A 方案：本机下载后 make publish）
        uses: actions/upload-artifact@v4
        with:
          name: packnest-release
          path: dist/
