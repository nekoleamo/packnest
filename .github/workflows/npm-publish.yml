# Trusted Publishing（npm OIDC）—— 不需要任何 token、不需要 2FA 弹窗。
#
# 前置（在 npmjs 网页上做一次，7 个包各配一条）：
#   https://www.npmjs.com/package/packnest/settings  →  Trusted Publisher  →  GitHub Actions
#     Organization or user: nekoleamo
#     Repository:           packnest
#     Workflow filename:    npm-publish.yml
#     Environment:          npm            （本文件里 environment: npm，必须一致）
#   对 @packnest/darwin-amd64、@packnest/darwin-arm64、@packnest/linux-amd64、
#   @packnest/linux-arm64、@packnest/windows-amd64、@packnest/windows-arm64 各做一次。
#
# 触发：git tag -a v0.6.3 -m "packnest 0.6.3" && git push origin v0.6.3
name: npm-publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v），留空则用 tag'
        required: false

permissions:
  contents: read
  id-token: write          # ← Trusted Publishing 的核心：OIDC 身份

jobs:
  publish:
    # 本机手动发 npm 时，把仓库 Variable SKIP_NPM_PUBLISH 设为 true 跳过这一步
    if: vars.SKIP_NPM_PUBLISH != 'true'
    runs-on: ubuntu-latest
    environment: npm        # 与 npmjs 上的 Environment 配置保持一致
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 升级 npm（OIDC 需要 ≥ 11.5.1）
        run: npm install -g npm@latest && npm --version

      - name: 门禁
        run: make check

      - name: 打产物
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          make release VERSION="$VERSION"
          sh scripts/release-npm.sh

      # 两条路自动二选一（`secrets` 不能出现在 if 里，只能在 env 里，再在 shell 里判断）：
      #   · 配了 Secret NPM_TOKEN → token 模式
      #   · 没配                   → Trusted Publishing（OIDC，无 token）
      - name: 发布（有 NPM_TOKEN 走 token，否则走 OIDC）
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "模式：token"
            sh scripts/release-npm.sh --publish
          else
            echo "模式：Trusted Publishing（OIDC）"
            sh scripts/release-npm.sh --publish --trusted
          fi

  # 可选：同一个 tag 同时把 6 平台产物传到 gitee release（国内二进制主源）。
  # 需要仓库里有 Secret GITEE_TOKEN，且变量 PUBLISH_GITEE=true；不想在云端存 token 就删掉这个 job，
  # 改在本机跑 `make gitee-release`（凭据只在本机）。
  gitee-release:
    if: always() && vars.PUBLISH_GITEE == 'true'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: 打产物并上传 gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          PK_GITEE_REPO: null_593_5354/packnest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          make release VERSION="$VERSION"
          sh scripts/release-gitee.sh --tag "v$VERSION"

  # ── 可选 2：brew / scoop 清单跟随新版本 ──
  # 开关：仓库 Variable PUBLISH_TAPS=true；Secret TAP_TOKEN = 有 homebrew-packnest 与 scoop-bucket
  # 写权限的 GitHub PAT（Actions 自带的 GITHUB_TOKEN 只能写当前仓库）。
  taps:
    if: always() && vars.PUBLISH_TAPS == 'true'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: 生成清单并推送到 tap / bucket
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          PK_GH_OWNER: nekoleamo
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          make release VERSION="$VERSION"
          sh scripts/gen-manifests.sh
          sh scripts/release-taps.sh --owner nekoleamo

  # ── 可选 3：把代码镜像推到 gitee ──
  # 开关：仓库 Variable SYNC_GITEE=true；Secret GITEE_TOKEN 需 projects 权限。
  gitee-mirror:
    if: vars.SYNC_GITEE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: push 到 gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          PK_GITEE_REPO: null_593_5354/packnest
        run: |
          git push "https://oauth2:${GITEE_TOKEN}@gitee.com/${PK_GITEE_REPO}.git" HEAD:main --tags --force
