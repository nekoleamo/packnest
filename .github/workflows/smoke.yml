# 6 平台实装 smoke（**只验证，不发布**）。
#
# 为什么要有它：`make check` 只能证明"编得过 + 单测绿"，装不装得上要在真机上跑一遍。
# 本机只有 macOS（arm64 原生 + amd64 Rosetta），Linux/Windows 的运行时行为只能靠这里覆盖。
#
# 触发：手动（workflow_dispatch）或打 tag 时。不参与发布——发布一律在本机（见 docs/publishing.md）。
name: smoke

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 必需组合（公共 runner 稳定可用的三个）
          - { runner: macos-15,       os: darwin,  arch: arm64 }
          - { runner: ubuntu-latest,  os: linux,   arch: amd64 }
          - { runner: windows-latest, os: windows, arch: amd64 }
          # 可选组合：label 不可用时不拖红整条流水线（continue-on-error）
          - { runner: macos-15-intel,   os: darwin, arch: amd64, optional: true }
          - { runner: ubuntu-24.04-arm, os: linux,  arch: arm64, optional: true }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      # checkout 只是为了 scripts/latest 兜底；产物一律从发布渠道下
      - uses: actions/checkout@v4
      - name: 版本号
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 以"线上最新 release"为准：用 scripts/latest 会在"刚发完版但还没推 scripts/latest"时
          # 装到上一个版本（2026-11-12 连踩两次），所以先查 GitHub Releases，查不到才回退仓库文件。
          v="$(gh api "repos/${{ github.repository }}/releases/latest" -q .tag_name 2>/dev/null || true)"
          # releases/latest 会指到 GUI 的独立 tag（gui-vX.Y.Z）——那不是 CLI 产物，不认
          case "$v" in v[0-9]*.[0-9]*.[0-9]*) v="$(printf '%s' "$v" | sed 's/^v//')" ;; *) v="" ;; esac
          if [ -z "$v" ]; then
            v="$(tr -d ' \t\r\n' < scripts/latest)"
            echo "::warning::线上没有 release，回退 scripts/latest=$v"
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "将验证版本：$v"

      - name: 从 gitee 取发布产物（用户视角）
        shell: bash
        env:
          V: ${{ steps.ver.outputs.v }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          # 用 GitHub Releases：gitee 对海外数据中心 IP 常返回 404（本 runner 实测），
          # 两个源的产物是本机同一批构建，sha256 一致（make verify-release 会逐条核对 gitee 那份）。
          base="https://github.com/nekoleamo/packnest/releases/download/v${V}"
          ext=tar.gz; [ "$OS" = windows ] && ext=zip
          name="packnest_${V}_${OS}_${ARCH}.${ext}"
          curl -fsSL --retry 3 --max-time 300 -o "$RUNNER_TEMP/$name" "$base/$name"
          curl -fsSL --retry 3 --max-time 60 -o "$RUNNER_TEMP/checksums.txt" "$base/checksums.txt"
          want=$(awk -v f="$name" '$2==f {print $1; exit}' "$RUNNER_TEMP/checksums.txt")
          if command -v sha256sum >/dev/null 2>&1; then
            # git-bash 的 sha256sum 会在哈希前加 `\`（binary 标记），先去掉再比
            got=$(sha256sum "$RUNNER_TEMP/$name" | awk '{print $1}' | tr -d '\\')
          else
            got=$(shasum -a 256 "$RUNNER_TEMP/$name" | cut -d' ' -f1)
          fi
          [ -n "$want" ] && [ "$want" = "$got" ] || { echo "sha256 不符（want=$want got=$got）"; exit 4; }
          mkdir -p "$RUNNER_TEMP/bin"
          if [ "$OS" = windows ]; then
            unzip -q "$RUNNER_TEMP/$name" -d "$RUNNER_TEMP/bin"
          else
            tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP/bin"
            chmod +x "$RUNNER_TEMP/bin/packnest"
          fi
          echo "已校验并解出 $name"

      - name: 跑起来（--version / doctor / install node / 卸载零残留）
        shell: bash
        env:
          PK_ROOT: ${{ runner.temp }}/pkroot
        run: |
          set -eu
          ext=""; [ "${{ matrix.os }}" = windows ] && ext=".exe"
          pk="$RUNNER_TEMP/bin/packnest$ext"
          ver=$("$pk" --version); echo "$ver"; echo "$ver" | grep -q "packnest v"   # git-bash 没有 /dev/stderr
          "$pk" doctor --json > doctor.json || true   # 有 error 级问题会退出 1，这里只断言内容
          grep -q '"schema": 1' doctor.json
          # 装真实运行时（走镜像回退链）；git-bash 不认 .cmd shim，Windows 只核对台账
          "$pk" install node@22
          if [ "${{ matrix.os }}" = windows ]; then
            "$pk" list | grep -q node
          else
            eval "$("$pk" env --shell bash)"
            node -v | grep -q '^v22\.'
            npm -v
          fi
          # pnpm 走 registry 平台包（@pnpm/exe.<os>-<arch>）—— 每个 OS 的平台名与产物布局都不同，
          # 这条断言守住"平台包能装、能跑"
          "$pk" install pnpm
          if [ "${{ matrix.os }}" = windows ]; then
            "$pk" list | grep -q pnpm
          else
            pnpm --version
          fi
          # 外部 provider 清单：坏清单不影响 CLI，好清单能列出来
          mkdir -p "$PK_ROOT/providers"
          printf 'id = "broken"\ndisplay = "B"\n' > "$PK_ROOT/providers/broken.toml"
          "$pk" list --json | grep -q '"schema": 1'
          "$pk" doctor --json > doctor2.json || true
          grep -q PROVIDER_EXTERNAL_INVALID doctor2.json
          # 零残留卸载（不删 pk 自己）
          "$pk" uninstall --all --purge --yes
          [ ! -d "$PK_ROOT" ] || { echo "PK_ROOT 还在：$PK_ROOT"; ls -la "$PK_ROOT"; exit 1; }

      - name: Windows：PowerShell 调 .cmd shim（原来的人工确认项，这里自动化）
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          PK_ROOT: ${{ runner.temp }}/pkroot-cmd
        run: |
          # 为什么单独一步：上面那步走的是 git-bash，而 git-bash 不认 .cmd shim，
          # 所以 %PK_ROOT%\bin 里的 pk.cmd / packnest.cmd / node.cmd 从来没被真 PowerShell 跑过
          # （docs/verify-manual.md 里这一项目前挂着"人工确认"）。
          $ErrorActionPreference = 'Stop'
          $pk = Join-Path $env:RUNNER_TEMP 'bin/packnest.exe'
          & $pk install node@22
          if ($LASTEXITCODE -ne 0) { throw "install 退出码 $LASTEXITCODE" }
          $bin = Join-Path $env:PK_ROOT 'bin'
          foreach ($name in 'pk', 'packnest') {
            $out = & "$bin\$name.cmd" --version
            if ("$out" -notmatch 'packnest v') { throw "$name.cmd --version 输出异常: $out" }
            Write-Host "$name.cmd --version -> $out"
          }
          # 工具自己的 shim：node/npm/npx 都是 .cmd 包装（内容 = @ECHO off + 引号目标 + %*）
          $nodeVer = & "$bin\node.cmd" -v
          if ("$nodeVer" -notmatch '^v22\.') { throw "node.cmd -v 输出异常: $nodeVer" }
          Write-Host "node.cmd -v -> $nodeVer"
          $npmVer = & "$bin\npm.cmd" -v
          if (-not $npmVer) { throw 'npm.cmd -v 没有输出' }
          Write-Host "npm.cmd -v -> $npmVer"
          # 零残留：.cmd 之外的东西也要清干净（与上面 bash 步骤同样的断言）
          & $pk uninstall --all --purge --yes
          if ($LASTEXITCODE -ne 0) { throw "uninstall 退出码 $LASTEXITCODE" }
          if (Test-Path $env:PK_ROOT) { throw "PK_ROOT 还在：$env:PK_ROOT" }

  # GUI 侧契约测试：只测 internal/pkcli（不编译 Wails 主程序，省掉 GTK/WebKit 依赖），
  # 用真实 bin/pk 跑一遍 version/list/doctor/mirror list/gc，保证 GUI 结构体不漂移。
  gui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: 构建 CLI
        run: make build
      - name: GUI 契约测试（pkcli）
        env:
          PK_SKIP_VERSION_CHECK: '1'
        run: cd cmd/pk-desktop && go test ./internal/pkcli
