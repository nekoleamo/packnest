# 构建 GUI（pk-desktop）三平台产物 —— **只产出 workflow artifact，不发布**。
#
# 2026-11-15（0.12.0）起界面是 mygo 原生 UI：**纯 Go、无 cgo、无 webview**，
# 所以整套产物在**一个 macOS runner 上交叉编译**即可（`make gui-cross` 本地等价），
# 不再需要 MSVC+WebView2 / GTK4+WebKitGTK 的构建环境，也不再分平台矩阵。
#
# 产物发布仍走"本机唯一发布者"：`gh run download` 拉回来，再
# `sh scripts/release-gui.sh --from-dir <dir>` 上传（字节与 CI 完全一致）。
name: gui-build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: 版本号
        id: v
        run: |
          # GUI 有独立版本号（cmd/pk-desktop/main.go 的 guiVersion），别拿 scripts/latest（那是 CLI 的）
          V=$(grep -oE 'guiVersion = "[0-9.]+"' cmd/pk-desktop/main.go | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "GUI 版本: $V"

      - name: 交叉编译四份产物（CGO_ENABLED=0）
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p out
          cd cmd/pk-desktop
          for t in windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o "../../out/pk-desktop$ext" .
            if [ "$os" = windows ]; then
              (cd ../../out && zip -q -X "packnest-desktop_${V}_${os}_${arch}.zip" "pk-desktop.exe" && rm "pk-desktop.exe")
            else
              tar -czf "../../out/packnest-desktop_${V}_${os}_${arch}.tar.gz" -C ../../out pk-desktop
              rm -f "../../out/pk-desktop"
            fi
            echo "  ok $os/$arch"
          done

      - name: 构建（macOS → .app.zip，本 runner 原生）
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          sh cmd/pk-desktop/packaging/build-macos.sh "$V"
          ( cd dist/gui && zip -q -r -X "../../out/packnest-desktop_${V}_darwin_arm64.app.zip" packnest.app )

      - uses: actions/upload-artifact@v4
        with:
          name: gui-all
          path: out/*
          if-no-files-found: error
