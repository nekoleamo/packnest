<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>packnest</title>
<style>
  :root { color-scheme: light dark; --fg:#111; --dim:#666; --bg:#fff; --line:#e5e5e5; --accent:#0a7d4f; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e8e8e8; --dim:#9a9a9a; --bg:#161616; --line:#2c2c2c; --accent:#4ade80; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.55 ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", sans-serif; color:var(--fg); background:var(--bg); }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; }
  header h1 { font-size:15px; margin:0; letter-spacing:.3px; }
  header .meta { color:var(--dim); font-size:12px; }
  main { padding:18px; display:grid; gap:18px; grid-template-columns:1fr 1fr; }
  @media (max-width: 860px) { main { grid-template-columns:1fr; } }
  section { border:1px solid var(--line); border-radius:10px; padding:14px; }
  section h2 { font-size:13px; margin:0 0 10px; color:var(--dim); font-weight:600; letter-spacing:.4px; text-transform:uppercase; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; }
  tr.active td:first-child::before { content:"● "; color:var(--accent); }
  button { font:inherit; padding:5px 10px; border-radius:7px; border:1px solid var(--line); background:transparent; color:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  input, select { font:inherit; padding:6px 9px; border-radius:7px; border:1px solid var(--line); background:transparent; color:inherit; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .bar { height:6px; border-radius:999px; background:var(--line); overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; background:var(--accent); transition:width .18s linear; }
  .dim { color:var(--dim); }
  .hint { color:var(--dim); font-size:12px; }
  pre { white-space:pre-wrap; word-break:break-all; font:12px/1.5 ui-monospace, Menlo, monospace; color:var(--dim); margin:8px 0 0; }
  .issue { display:flex; gap:8px; font-size:13px; padding:3px 0; }
  .sev-warn { color:#b45309; } .sev-error { color:#b91c1c; } .sev-info { color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>packnest</h1>
  <span class="meta" id="status">正在定位 pk…</span>
</header>

<main>
  <section>
    <h2>已装工具</h2>
    <div class="row">
      <input id="spec" placeholder="node@22" size="14">
      <button id="installBtn">安装</button>
      <button id="refreshBtn">刷新</button>
    </div>
    <div class="row">
      <select id="toolPick" title="选工具看可装版本"></select>
      <select id="versionPick" title="选版本"></select>
      <button id="installPicked">装这个版本</button>
    </div>
    <div class="bar" id="bar" hidden><i></i></div>
    <pre id="log" hidden></pre>
    <table id="tools"><thead><tr><th>工具</th><th>版本</th><th>来源</th><th>大小</th><th></th></tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>镜像档</h2>
    <div class="row"><select id="mirror"></select><button id="mirrorBtn">切换</button></div>
    <h2 style="margin-top:16px">体检</h2>
    <div class="row"><button id="doctorBtn">运行 pk doctor</button><label class="hint"><input type="checkbox" id="globals"> 含全局包</label></div>
    <div id="issues"></div>
  </section>

  <section>
    <h2>磁盘占用与回收</h2>
    <div class="row"><button id="gcPreview">预演</button><button id="gcRun">执行 GC</button></div>
    <pre id="gcOut" hidden></pre>
  </section>

  <section>
    <h2>说明</h2>
    <p class="hint">这是 <b>pk</b> 的可视化补充，所有操作都通过调用本机已安装的 <code>pk</code>（子进程 + <code>--json</code>）完成。
    没有装 CLI 时，这里只会给出安装提示，不会自己下东西。</p>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
