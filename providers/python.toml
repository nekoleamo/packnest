# Python —— 只装 python-build-standalone 预编译版，永不源码编译（方案 §4.0 / §18）
# 索引是目录列举式（npmmirror 已镜像，20261026/ 下 993 个条目），不是 index.json。
id = "python"
display = "Python"
kind = "binary"

[index]
kind = "dirlist"
[index.urls]
default = "https://github.com/astral-sh/python-build-standalone/releases"
cn      = "https://registry.npmmirror.com/-/binary/python-build-standalone/"

[artifact]
[artifact.urls]
default = "https://github.com/astral-sh/python-build-standalone/releases/download/{version}/cpython-{version}+{tag}-{platform}-install_only.{ext}"
cn      = "https://registry.npmmirror.com/-/binary/python-build-standalone/{version}/cpython-{version}+{tag}-{platform}-install_only.{ext}"
[artifact.ext]
windows = "tar.gz"
darwin  = "tar.gz"
linux   = "tar.gz"
[artifact.platform]
darwin-amd64  = "x86_64-apple-darwin"
darwin-arm64  = "aarch64-apple-darwin"
linux-amd64   = "x86_64-unknown-linux-gnu"
linux-arm64   = "aarch64-unknown-linux-gnu"
windows-amd64 = "x86_64-pc-windows-msvc"

[checksum]
# pbs 每个 release 有 SHA256SUMS
format = "gnu-sums"
mode   = "tofu-then-verify"
[checksum.urls]
default = "https://github.com/astral-sh/python-build-standalone/releases/download/{version}/SHA256SUMS"
cn      = "https://registry.npmmirror.com/-/binary/python-build-standalone/{version}/SHA256SUMS"

[layout]
strip = 1
bins  = ["python3", "pip3"]
