# Go —— 装完必须写 GOTOOLCHAIN=local，否则 go 自己会再去下一套工具链（方案 §4.0 / §6.6）
id = "go"
display = "Go"
kind = "binary"

[index]
# 官方 dl 页的 JSON 自带每个产物的 sha256（省一次校验和请求）。
# ⚠️ 必须带 include=all，否则只返回最新两条（实测 2 条 vs 369 条）。
kind = "json"
version_prefix = "go"
[index.urls]
default = "https://go.dev/dl/?mode=json&include=all"
# 国内档用官方 CN 镜像（同一份 JSON，实测 1.2s vs go.dev 1.5s；host 不同也是天然灾备）。
# ⚠️ aliyun/tuna/ustc/huaweicloud 的 /golang/ 路径**不提供** ?mode=json（实测返回 HTML/404），别照抄。
cn      = "https://golang.google.cn/dl/?mode=json&include=all"

[artifact]
# 文件名直接用索引给的（go{version}.{platform}.{ext}），{filename} 更稳。
[artifact.urls]
default = "https://go.dev/dl/{filename}"
aliyun  = "https://mirrors.aliyun.com/golang/{filename}"
[artifact.ext]
windows = "zip"
darwin  = "tar.gz"
linux   = "tar.gz"
[artifact.platform]
darwin-amd64  = "darwin-amd64"
darwin-arm64  = "darwin-arm64"
linux-amd64   = "linux-amd64"
linux-arm64   = "linux-arm64"
windows-amd64 = "windows-amd64"
windows-arm64 = "windows-arm64"

[checksum]
format = "index-inline"
mode   = "tofu-then-verify"

[layout]
strip = 1
bins  = ["go", "gofmt"]

[toolchain.env]
GOTOOLCHAIN = "local"
